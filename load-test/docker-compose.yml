# docker-compose.yml – local load test (no AWS credentials required)
#
# Usage:
#   1. Generate test data:
#        node load-test/scripts/generate-domains.js --output-dir load-test/output
#
#   2. Start all services:
#        docker compose -f load-test/docker-compose.yml up --build
#
# Environment overrides (set in shell or a .env file beside this file):
#   DINODNS_CLUSTER_MODE  – "true" to enable Node.js cluster mode  (default: false)
#   TEST_DURATION         – DNSperf test duration in seconds        (default: 30)
#   DNSPERF_CLIENTS       – concurrent DNSperf clients              (default: 10)
#   DNSPERF_MAX_QPS       – max queries/s per dnsperf instance (0=unlimited, default: 0)

version: "3.9"

networks:
  dns_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24

services:
  # --------------------------------------------------------------------------
  # DinoDNS
  # --------------------------------------------------------------------------
  dinodns:
    build:
      context: ..          # repository root (DinoDNS source)
      dockerfile: load-test/docker/dinodns/Dockerfile
    container_name: dinodns
    environment:
      RECORDS_FILE: /etc/dinodns/dinodns-records.txt
      DNS_PORT: "53"
      CLUSTER_MODE: "${DINODNS_CLUSTER_MODE:-false}"
    volumes:
      - ./output/dinodns-records.txt:/etc/dinodns/dinodns-records.txt:ro
    networks:
      dns_net:
        ipv4_address: 172.28.0.2
    # Privileged binding to port 53 inside the container (no host-port exposure needed)
    cap_add:
      - NET_BIND_SERVICE
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # CoreDNS
  # --------------------------------------------------------------------------
  coredns:
    image: coredns/coredns:latest
    container_name: coredns
    command: ["-conf", "/etc/coredns/Corefile"]
    volumes:
      - ./output/Corefile:/etc/coredns/Corefile:ro
      - ./output/db.example.com:/etc/coredns/db.example.com:ro
    networks:
      dns_net:
        ipv4_address: 172.28.0.3
    cap_add:
      - NET_BIND_SERVICE
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # DNSperf – targets DinoDNS
  # --------------------------------------------------------------------------
  dnsperf-dinodns:
    build:
      context: docker/dnsperf
    container_name: dnsperf-dinodns
    depends_on:
      - dinodns
    environment:
      DNS_SERVER: "172.28.0.2"
      DNS_PORT: "53"
      QUERY_FILE: /etc/dnsperf/dnsperf.txt
      TEST_DURATION: "${TEST_DURATION:-30}"
      CLIENTS: "${DNSPERF_CLIENTS:-10}"
      MAX_QPS: "${DNSPERF_MAX_QPS:-0}"
      RESULT_FILE: /results/dnsperf-dinodns.txt
    volumes:
      - ./output/dnsperf.txt:/etc/dnsperf/dnsperf.txt:ro
      - ./results:/results
    networks:
      - dns_net
    restart: "no"

  # --------------------------------------------------------------------------
  # DNSperf – targets CoreDNS
  # --------------------------------------------------------------------------
  dnsperf-coredns:
    build:
      context: docker/dnsperf
    container_name: dnsperf-coredns
    depends_on:
      - coredns
    environment:
      DNS_SERVER: "172.28.0.3"
      DNS_PORT: "53"
      QUERY_FILE: /etc/dnsperf/dnsperf.txt
      TEST_DURATION: "${TEST_DURATION:-30}"
      CLIENTS: "${DNSPERF_CLIENTS:-10}"
      MAX_QPS: "${DNSPERF_MAX_QPS:-0}"
      RESULT_FILE: /results/dnsperf-coredns.txt
    volumes:
      - ./output/dnsperf.txt:/etc/dnsperf/dnsperf.txt:ro
      - ./results:/results
    networks:
      - dns_net
    restart: "no"
